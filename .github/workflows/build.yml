# Build the custom 16MB TL-WR941ND v4 firmware from source, exactly like the
# local build: same Containerfile image, same _inner-build.sh, same
# seed -- so a local podman build and this CI build are directly comparable
# (supply-chain cross-check).
#
# The repo's source of truth is a self-hosted Gitea instance that push-mirrors
# here; GitHub is the build + release executor. Flow:
#
# - push to a renovate/** branch (Renovate's bump branch, arriving via the
#   mirror): canary build, no release. Renovate only touches build-relevant
#   files, so no paths filter is needed.
# - push of a v* tag (created on Gitea by scripts/tag-release.sh after the
#   bump PR is merged, arriving via the mirror): build + publish the Release.
#   Plain master pushes do NOT build -- their content was already canary-built
#   on the renovate branch, and doc-only pushes have nothing to build.
# - workflow_dispatch: manual run on any ref; dispatching on an existing tag
#   re-runs that release (e.g. after deleting it for a re-release).
#
# NOT built here: the FULLFLASH image. It needs the device-unique u-boot + art
# dumps (with the device MAC), which live only in the local backup, on purpose.

name: build

on:
  push:
    branches: ['renovate/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load device build settings
        run: cat ci/wr941nd-v4-16m.env | grep -v '^#' | grep . >> "$GITHUB_ENV"

      - name: Verify a release tag matches the pinned version
        # Fail fast (before the 2h build) if a v* tag does not correspond to
        # the OPENWRT_TAG pinned in ci/*.env at that commit -- e.g. a tag
        # created on the wrong commit, or a typo.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${OPENWRT_TAG}-${DEVICE_NAME}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != expected '$expected' (from ci/*.env at this commit)"
            exit 1
          fi

      - name: Free up runner disk space
        # The OpenWrt buildroot needs ~20GB; drop the biggest preinstalled
        # toolchains we don't use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Build the builder container image
        run: docker build -t openwrt-builder -f Containerfile .

      - name: Clone OpenWrt at the pinned tag
        # github.com mirror of git.openwrt.org -- identical tags, much faster
        # from an Actions runner.
        # Blobless clone, NOT shallow: scripts/getver.sh counts commits to derive
        # the revision (rXXXXX); with --depth 1 it falls back to r1 and taints
        # base-files' version + /etc/openwrt_release (seen on the first CI run).
        run: |
          git clone --filter=blob:none --branch "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git "$HOME/openwrt"

      - name: Install the project apk signing keypair
        # Without this every build tree generates its OWN signing key: the
        # public key lands in /etc/apk/keys/public-key.pem and every package
        # signature depends on it, so two builds of the same tag can never be
        # bit-identical (verified 2026-07-06: this + the kernel banner were the
        # only diffs). The secrets hold the project keypair -- the same
        # private-key.pem / public-key.pem that sit in the local tree's root.
        # Skipped (build falls back to a fresh key) if the secret is not set.
        # NOTE: the secrets context is not allowed in step-level `if`, so the
        # emptiness check happens in the shell instead.
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          APK_PUBLIC_KEY: ${{ secrets.APK_PUBLIC_KEY }}
        run: |
          if [ -z "$APK_PRIVATE_KEY" ]; then
            echo "no APK_PRIVATE_KEY secret; the build will generate a fresh key"
            exit 0
          fi
          printf '%s\n' "$APK_PRIVATE_KEY" > "$HOME/openwrt/private-key.pem"
          printf '%s\n' "$APK_PUBLIC_KEY" > "$HOME/openwrt/public-key.pem"
          echo "project signing key installed"

      - name: Restore dl/ cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openwrt/dl
          key: dl-${{ env.OPENWRT_TAG }}-${{ hashFiles('config/**') }}
          restore-keys: |
            dl-${{ env.OPENWRT_TAG }}-
            dl-

      - name: Build firmware in the container
        # The image's 'builder' user is uid 1000; the runner user is not, so
        # hand the tree over for the build and take it back for cache/upload.
        run: |
          sudo chown -R 1000:1000 "$HOME/openwrt"
          docker run --rm \
            -v "$HOME/openwrt:/work" \
            -v "$PWD/config:/opt/config:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            -e SEED_FILE="$SEED_FILE" \
            -u 1000:1000 -w /work \
            openwrt-builder bash /opt/scripts/_inner-build.sh
          sudo chown -R "$(id -u):$(id -g)" "$HOME/openwrt"

      - name: Collect artifacts
        run: |
          OUT="$HOME/openwrt/bin/targets/ath79/tiny"
          mkdir -p out
          cp "$OUT"/openwrt-*tl-wr941-v4-16m*-factory.bin out/
          cp "$OUT"/openwrt-*tl-wr941-v4-16m*-sysupgrade.bin out/
          cp "$OUT"/*.manifest out/
          cp "$OUT"/config.buildinfo out/ 2>/dev/null || true
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DEVICE_NAME }}-${{ env.OPENWRT_TAG }}
          path: out/

      - name: Publish release
        # Tag-driven: only a v* tag ref publishes (tag push from the mirror,
        # or a manual dispatch on the tag for a deliberate re-release).
        # Branch builds -- canary or dispatch -- never publish.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.OPENWRT_TAG }}-${{ env.DEVICE_NAME }}
          name: OpenWrt ${{ env.OPENWRT_TAG }} — TL-WR941ND v4 (16M)
          files: out/*
          body: |
            Custom 16MB build for the hardware-modded TL-WR941ND v4
            (`tplink_tl-wr941-v4-16m`, ath79/tiny, seed `${{ env.SEED_FILE }}`).

            **Requires BOTH hardware mods: 16MB flash (W25Q128-class) AND the
            32→64MB RAM upgrade.** Never flash a stock device: the stock 4MB
            flash cannot hold this image, and on the stock 32MB RAM OpenWrt
            25.12 constantly OOM-reboots.

            ⚠️ **`sysupgrade` will NOT stop you.** The modded board reports the
            stock compat string, so this image claims `tplink,tl-wr941-v4` (and
            `tl-wr941nd-v4`, `tl-wr741nd`) in `SUPPORTED_DEVICES` — a stock 4MB
            device accepts it without `--force` and bricks. The wrong-device
            guard does not apply here; verify your hardware yourself.

            Upgrade from a running 16M build:
            `sysupgrade` with settings kept, using the `-sysupgrade.bin` image.
            Verify `SHA256SUMS` first; optionally cross-check against a local
            podman build of the same tag.
