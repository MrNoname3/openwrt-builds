# The same build as scripts/build.sh, so the two can be compared byte for byte.
# A renovate/** branch gets a canary build; a v* tag also publishes the Release
# (the README's CI section has the whole flow). The FULLFLASH image is never
# built here: it needs the unit's own u-boot and art dumps.

name: build

on:
  push:
    branches: ['renovate/**']
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build job runs the OpenWrt build and third-party
# Actions, including whatever a Renovate branch brings. Only the release job,
# which runs on v* tags, gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      openwrt_tag: ${{ steps.pin.outputs.OPENWRT_TAG }}
      seed_file: ${{ steps.pin.outputs.SEED_FILE }}
      device_name: ${{ steps.pin.outputs.DEVICE_NAME }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load device build settings
        id: pin
        run: |
          grep -v '^#' ci/wr941nd-v4-16m.env | grep . > pin.env
          cat pin.env >> "$GITHUB_ENV"
          cat pin.env >> "$GITHUB_OUTPUT"

      - name: Verify a release tag matches the pinned version
        # Fail before the build if the tag is not this commit's pinned release.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${OPENWRT_TAG}-${DEVICE_NAME}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != expected '$expected' (from ci/*.env at this commit)"
            exit 1
          fi

      - name: Free up runner disk space
        # The buildroot needs more disk than the runner leaves free; drop
        # large preinstalled toolchains it does not use.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Build the builder container image
        run: docker build -t openwrt-builder -f Containerfile .

      - name: Clone OpenWrt at the pinned tag
        # Blobless, not shallow: scripts/getver.sh counts commits to derive the
        # revision that ends up in the image. The commit must match the pin.
        run: |
          git clone --filter=blob:none --branch "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git "$HOME/openwrt"
          head="$(git -C "$HOME/openwrt" rev-parse HEAD)"
          if [ "$head" != "$OPENWRT_COMMIT" ]; then
            echo "::error::$OPENWRT_TAG resolves to $head, but ci/*.env pins $OPENWRT_COMMIT"
            exit 1
          fi

      - name: Install the project apk signing keypair
        # Without the project keypair the tree generates its own key, and no
        # package signature matches a local build. Secrets cannot be tested in
        # a step-level `if`, hence the shell check.
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          APK_PUBLIC_KEY: ${{ secrets.APK_PUBLIC_KEY }}
        run: |
          if [ -z "$APK_PRIVATE_KEY" ]; then
            echo "no APK_PRIVATE_KEY secret; the build will generate a fresh key"
            exit 0
          fi
          printf '%s\n' "$APK_PRIVATE_KEY" > "$HOME/openwrt/private-key.pem"
          printf '%s\n' "$APK_PUBLIC_KEY" > "$HOME/openwrt/public-key.pem"
          echo "project signing key installed"

      - name: Restore dl/ cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openwrt/dl
          key: dl-${{ env.OPENWRT_TAG }}-${{ hashFiles('config/**') }}
          restore-keys: |
            dl-${{ env.OPENWRT_TAG }}-
            dl-

      - name: Build firmware in the container
        # The image's 'builder' user is uid 1000; the runner user is not, so
        # hand the tree over for the build and take it back for cache/upload.
        run: |
          sudo chown -R 1000:1000 "$HOME/openwrt"
          docker run --rm \
            -v "$HOME/openwrt:/work" \
            -v "$PWD/config:/opt/config:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            -e SEED_FILE="$SEED_FILE" \
            -u 1000:1000 -w /work \
            openwrt-builder bash /opt/scripts/_inner-build.sh
          sudo chown -R "$(id -u):$(id -g)" "$HOME/openwrt"

      - name: Collect artifacts
        run: |
          OUT="$HOME/openwrt/bin/targets/ath79/tiny"
          mkdir -p out
          cp "$OUT"/openwrt-*tl-wr941-v4-16m*-factory.bin out/
          cp "$OUT"/openwrt-*tl-wr941-v4-16m*-sysupgrade.bin out/
          cp "$OUT"/*.manifest out/
          cp "$OUT"/config.buildinfo out/ 2>/dev/null || true
          (cd out && sha256sum -- * > SHA256SUMS)
          ls -lh out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DEVICE_NAME }}-${{ env.OPENWRT_TAG }}
          path: out/

  release:
    # Only a v* tag ref publishes: a tag push, or a dispatch on the tag to
    # re-release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    env:
      OPENWRT_TAG: ${{ needs.build.outputs.openwrt_tag }}
      SEED_FILE: ${{ needs.build.outputs.seed_file }}
      DEVICE_NAME: ${{ needs.build.outputs.device_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DEVICE_NAME }}-${{ env.OPENWRT_TAG }}
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.OPENWRT_TAG }}-${{ env.DEVICE_NAME }}
          name: OpenWrt ${{ env.OPENWRT_TAG }} — TL-WR941ND v4 (16M)
          files: out/*
          body: |
            Custom 16MB build for the hardware-modded TL-WR941ND v4
            (`tplink_tl-wr941-v4-16m`, ath79/tiny, seed `${{ env.SEED_FILE }}`).

            **Only for a board with BOTH mods: 16MB flash and 64MB RAM.**
            ⚠️ `sysupgrade` will not stop you: the image claims the stock
            compat string, so a stock 4MB device accepts it without `--force`
            and bricks. Read the
            [hardware requirements](${{ github.server_url }}/${{ github.repository }}#readme)
            before flashing.

            Upgrade a running 16M build with the `-sysupgrade.bin` image,
            settings kept, after checking it against `SHA256SUMS`.
