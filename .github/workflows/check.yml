name: check

# Runs scripts/check.sh on every push. Portable to Gitea Actions, which also
# reads .github/workflows: no actions/cache, and sudo only when not root.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install linters
        # actionlint is a pinned release, checked against its sha256; Renovate
        # updates the version and sum on each line together.
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; else SUDO=""; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends shellcheck yamllint
          case "$(uname -m)" in
            # renovate: datasource=github-release-attachments depName=rhysd/actionlint
            x86_64) arch=amd64 version=v1.7.12 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            # renovate: datasource=github-release-attachments depName=rhysd/actionlint
            aarch64) arch=arm64 version=v1.7.12 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no actionlint pinned for $(uname -m)"; exit 1 ;;
          esac
          f="actionlint_${version#v}_linux_${arch}.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${version}/$f"
          echo "$sum  $f" | sha256sum -c -
          tar xzf "$f" actionlint
          $SUDO install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$f" actionlint

      - name: Run the release gate
        run: ./scripts/check.sh
