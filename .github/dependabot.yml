# Keep the SHA-pinned GitHub Actions up to date: dependabot understands
# `uses: owner/action@<sha> # vX.Y.Z` pins and bumps both the SHA and the
# version comment in a PR. (OpenWrt itself is watched by our own
# check-openwrt-release workflow, not dependabot -- it tracks release TAGS,
# which dependabot cannot.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
